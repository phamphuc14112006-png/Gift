        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #password-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0011 0%, #000000 100%);
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .pwd-box {
            background: rgba(255, 255, 255, 0.04);

        .pwd-box input {
            width: 100%; padding: 12px 20px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff4477; border-radius: 25px;
            color: #fff; font-size: 18px; text-align: center; outline: none;
            letter-spacing: 4px; transition: all 0.3s;

            border-radius: 25px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
        .pwd-box button:active { transform: scale(0.97); }
        #pwd-error { color: #ff3333; font-size: 13px; margin-top: 12px; display: none; animation: shake 0.4s; }

        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff; cursor: pointer;
        }
        #start-overlay h2 { font-size: 22px; margin-bottom: 15px; letter-spacing: 2px; animation: pulse 1.5s infinite; text-align: center; padding: 0 20px; }
        #start-overlay p { font-size: 14px; color: #aaa; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        #btn-thoi {
            position: absolute; bottom: 12%; padding: 15px 50px;
            background: linear-gradient(45deg, #ff0000, #ff5500); border: none;
            color: #fff; font-size: 18px; font-weight: bold; border-radius: 30px;
            cursor: pointer; pointer-events: auto; opacity: 0; transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 0 30px #ff0000, inset 0 0 10px rgba(255,255,255,0.5);
        }

        #laser-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fbf9f3; z-index: 100; display: none; justify-content: center;
            align-items: center; overflow: hidden;
        }
        
        #laser-text-container {
            font-family: "Times New Roman", Times, serif;
            font-size: 25px; font-weight: 900; color: transparent;
            text-align: center; width: 100%; padding: 0 24px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 20px; user-select: none;
            perspective: 1200px; line-height: 1.5;
        }

        .laser-line-text { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
        .word { display: flex; gap: 0px; align-items: center; }
        .char { display: inline-block; color: #fbf9f3; position: relative; transform-origin: center center; will-change: transform, color, text-shadow; }

        #laser-line {
            position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: linear-gradient(to bottom, rgba(255, 0, 0, 0) 0%, rgba(255, 30, 0, 0.4) 40%, #ff1100 85%, #ffffcc 100%);
            box-shadow: 0 0 12px #ff0000, 0 0 25px #ff3300, 0 0 40px #ff0055;
            z-index: 104; pointer-events: none; display: none; transform-origin: top center;
        }

        #laser-spark {
            position: absolute; width: 18px; height: 18px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 15px #fff, 0 0 30px #ff1100, 0 0 60px #ffaa00, 0 0 90px #ff0055, 0 0 150px #ff0000;

        }

        .sparkle-particle { position: absolute; width: 5px; height: 5px; border-radius: 50%; pointer-events: none; z-index: 106; }

        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

        @media (max-width: 480px) {

        }

    <script>
        // Hàm băm chuỗi sử dụng SHA-256 chuẩn của trình duyệt
        async function hashString(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Mã hash cố định của mật khẩu (đã được băm ẩn)
        const TARGET_HASH = "514c91742967e4d505c3a047c6009aca5f76bfe1e37e3d48505c0fd75aabc2c6";

        async function checkPassword() {
            const input = document.getElementById('pwd-input').value;
            const errorHint = document.getElementById('pwd-error');
            
            // Băm giá trị người dùng vừa nhập để kiểm tra ngầm
            const inputHash = await hashString(input);

            if (inputHash === TARGET_HASH) {
                const overlay = document.getElementById('password-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 800);

                // Báo cho C++ biết mật khẩu đúng (chỉ hoạt động trong WebView2)
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage('PASSWORD_CORRECT');
                }
            } else {
                // Sai mật khẩu: xóa sạch ô nhập và bắt nhập lại từ đầu
                const inputEl = document.getElementById('pwd-input');
                inputEl.value = '';
                inputEl.focus();

                errorHint.style.display = 'block';
                errorHint.style.animation = 'none';
                errorHint.offsetHeight;
                errorHint.style.animation = 'shake 0.4s';
            }
        }

        // ─── Responsive scale helpers ──────────────────────────────────────────
        function getResponsiveScale() {
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            if (minDim < 400) return 0.42;
            if (minDim < 500) return 0.52;
            if (minDim < 700) return 0.65;
            if (minDim < 900) return 0.80;
            return 1.0;
        }

        // Scale riêng cho chữ 3D (PlaneGeometry size)
        function getResponsiveTextScale() {
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            if (minDim < 400) return 0.38;   // phone nhỏ
            if (minDim < 500) return 0.48;   // phone thường
            if (minDim < 700) return 0.60;   // phone lớn / tablet nhỏ
            if (minDim < 900) return 0.75;   // tablet
            return 1.0;                       // laptop / desktop
        }

        // Camera Z phù hợp để toàn bộ scene vừa màn hình

            const minDim = Math.min(window.innerWidth, window.innerHeight);
            const portrait = window.innerHeight > window.innerWidth;
            if (minDim < 400) return portrait ? 42 : 36;
            if (minDim < 500) return portrait ? 38 : 32;
            if (minDim < 700) return portrait ? 34 : 30;
            if (minDim < 900) return portrait ? 30 : 28;
            return 28;
        }

        const LOTUS_PINK = [1.00, 0.86, 0.90];
        const LOTUS_PINK_EDGE = [1.00, 0.86, 0.90];
        const LOTUS_PINK_HEX = 0xffdbe6; // dùng cho chất liệu số 27 dạng khối 3D bóng (cùng style số 30/08)

        window.addEventListener('DOMContentLoaded', () => {
            hbdCoordsCache = preRenderSplitText("HAPPY", "BIRTHDAY", 650, 260, 64, 0.32, 0.68, 34, 15);
            const c2 = preRenderCandleDigit("2", 220, 320, 230);
            candle2Fill = c2.fill; candle2Outline = c2.outline;
            const c7 = preRenderCandleDigit("7", 220, 320, 230);
            candle7Fill = c7.fill; candle7Outline = c7.outline;

        function preRenderCandleDigit(digit, width, height, fontSize) {
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height);
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 28; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
            ctx.strokeText(digit, width / 2, height / 2);
            ctx.fillText(digit, width / 2, height / 2);
            const fillData = ctx.getImageData(0, 0, width, height).data;

            const canvas2 = document.createElement('canvas');
            canvas2.width = width; canvas2.height = height;
            const ctx2 = canvas2.getContext('2d');
            ctx2.fillStyle = '#000'; ctx2.fillRect(0, 0, width, height);
            ctx2.font = `bold ${fontSize}px Arial`;
            ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
            ctx2.lineWidth = 38; ctx2.strokeStyle = '#fff';
            ctx2.strokeText(digit, width / 2, height / 2);
            const outlineRaw = ctx2.getImageData(0, 0, width, height).data;

            const fill = [], outline = [];
            const sx = 5.5, sy = 7.5;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const px = ((x / width) - 0.5) * sx;
                    const py = -((y / height) - 0.5) * sy;
                    if (fillData[idx] > 140) fill.push({ x: px, y: py });
                    else if (outlineRaw[idx] > 140) outline.push({ x: px, y: py });
                }
            }
            return { fill, outline };
        }

        function preRenderSplitText(line1, line2, width, height, fontSize, y1Factor, y2Factor, scaleX, scaleY) {
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(line1, width / 2, height * y1Factor);
            ctx.fillText(line2, width / 2, height * y2Factor);
            const imgData = ctx.getImageData(0, 0, width, height).data;
            const coords = [];
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let idx = (y * width + x) * 4;
                    if (imgData[idx] > 120) {
                        coords.push({ x: ((x / width) - 0.5) * scaleX, y: -((y / height) - 0.5) * scaleY });
                    }
                }
            }
            return coords;
        }

        function createSolid3DText(text, yOffset, size = 1.6, textScale = 1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold 72px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const scaledSize = size * textScale;
            const geometry = new THREE.PlaneGeometry(scaledSize * 4, scaledSize);
            const material = new THREE.MeshStandardMaterial({
                map: texture, transparent: true, side: THREE.DoubleSide, roughness: 0.1, metalness: 0.9,
                emissive: new THREE.Color(0x00bfff), emissiveIntensity: 1.4
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = yOffset * textScale;
            const depthGroup = new THREE.Group();
            for (let j = 0; j < 10; j++) {
                let layer = mesh.clone(); layer.position.z = -j * 0.07;
                depthGroup.add(layer);
            }
            return depthGroup;
        }

        // Số 27 dạng khối 3D đặc (style SVG: lớp sâu hồng đậm + mặt trước hồng tươi, không viền đen, không nhựa)
        // frontHex = mặt trước sáng (#ffb6c1), depthHex = lớp đổ khối đậm hơn (#d47385)
        function createGlowDigitMesh(text, x, y, z, width, height, frontHex, depthHex) {
            const frontCol = frontHex != null ? frontHex : 0xffb6c1;
            const depthCol = depthHex != null ? depthHex : 0xd47385;

            // Canvas alpha mask: chữ trắng đặc trên nền trong suốt (tránh viền đen)
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 512);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 380px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 270);
            const texture = new THREE.CanvasTexture(canvas);
            texture.premultiplyAlpha = true;
            texture.needsUpdate = true;

            const geometry = new THREE.PlaneGeometry(width, height);
            const group = new THREE.Group();
            const layers = 12;
            const stepZ = 0.055;

            for (let j = 0; j < layers; j++) {
                const t = j / (layers - 1);
                const isFront = j === 0;
                const col = isFront ? frontCol : depthCol;
                const intensity = isFront ? 1.0 : (0.75 - t * 0.25);
                const mat = new THREE.MeshBasicMaterial({
                    map: texture,
                    color: new THREE.Color(col).multiplyScalar(intensity),
                    transparent: true,
                    alphaTest: 0.15,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    blending: THREE.NormalBlending
                });
                const mesh = new THREE.Mesh(geometry, mat);
                mesh.position.z = -j * stepZ;
                group.add(mesh);
            }
            group.position.set(x, y, z);
            return group;
        }

        function startExperience() {
            document.getElementById('start-overlay').style.display = 'none';
            audio.play().catch(e => console.log("Audio play blocked", e));
            init3D();
            runTimeline();
        }

        function init3D() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, getResponsiveCameraZ());

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
            dirLight.position.set(5, 12, 15); scene.add(dirLight);
            const ambientLight = new THREE.AmbientLight(0x404040, 1.8); scene.add(ambientLight);

            textGroup3D = new THREE.Group();
            const TS = getResponsiveTextScale();
            const nameMesh = createSolid3DText("BÍCH THỦY", 0.9, 1.8, TS);
            const numMesh  = createSolid3DText("30/08", -1.1, 2.0, TS);
            textGroup3D.add(nameMesh); textGroup3D.add(numMesh);
            textGroup3D.position.set(0, 0.5, 0); textGroup3D.scale.set(0, 0, 0);
            scene.add(textGroup3D);

            positions = new Float32Array(particleCount * 3);
            colors    = new Float32Array(particleCount * 3);
            baseX = new Float32Array(particleCount);
            baseY = new Float32Array(particleCount);
            baseZ = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                let theta = Math.random() * Math.PI * 2; let r = Math.random() * 22 + 2;
                positions[i*3]   = Math.sin(theta) * r;
                positions[i*3+1] = -35 + (Math.random() - 0.5) * 4;
                positions[i*3+2] = Math.cos(theta) * r;
                colors[i*3] = 1.0; colors[i*3+1] = 1.0; colors[i*3+2] = 1.0;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

            const pCanvas = document.createElement('canvas'); pCanvas.width = 16; pCanvas.height = 16;
            const pCtx = pCanvas.getContext('2d');
            let grad = pCtx.createRadialGradient(8,8,0, 8,8,8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            pCtx.fillStyle = grad; pCtx.fillRect(0,0,16,16);
            const pTexture = new THREE.CanvasTexture(pCanvas);

            // Texture hạt dạng viên bi 3D (có điểm sáng lệch tâm + viền tối) dùng cho nến số 27
            const bCanvas = document.createElement('canvas'); bCanvas.width = 32; bCanvas.height = 32;
            const bCtx = bCanvas.getContext('2d');
            let bGrad = bCtx.createRadialGradient(12, 11, 0, 16, 16, 17);
            bGrad.addColorStop(0,    'rgba(255,255,255,1)');
            bGrad.addColorStop(0.25, 'rgba(255,255,255,0.95)');
            bGrad.addColorStop(0.55, 'rgba(255,255,255,0.75)');
            bGrad.addColorStop(0.8,  'rgba(255,255,255,0.35)');
            bGrad.addColorStop(1,    'rgba(255,255,255,0)');
            bCtx.fillStyle = bGrad; bCtx.fillRect(0, 0, 32, 32);
            const beadTexture = new THREE.CanvasTexture(bCanvas);
            window.__beadTexture = beadTexture;

            const material = new THREE.PointsMaterial({
                size: 0.03, map: pTexture, vertexColors: true,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            });
            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            render();
        }

        function render() {
            requestAnimationFrame(render);
            const time = clock.getElapsedTime();
            if (currentShape === "text") { particleSystem.rotation.y = Math.sin(time * 0.2) * 0.15; }
            else if (currentShape === "vortex" || currentShape === "cake") { particleSystem.rotation.y += 0.005; }
            else { particleSystem.rotation.y = 0; }

            // Nến 27 và lửa không quay theo bánh
            if (candleSystem) candleSystem.rotation.y = 0;
            if (flameSystem) flameSystem.rotation.y = 0;

            if (isHeartRotating) { updateHeartPhase(time); }
            if (currentShape === "cake" && cakeSparkleData) { updateCakeSparkle(time); }
            if (currentShape === "cake" && candleFlameData) { updateCandleFlames(time); }
            renderer.render(scene, camera);
        }

        // Nhiễu giả ngẫu nhiên: tổng nhiều sóng sin tần số lệch nhau (tỉ lệ vô tỉ) để không
        // tạo cảm giác lặp lại đều đặn — dùng cho mọi dao động của ngọn lửa bên dưới.
        function flameNoise(t, seed) {
            return Math.sin(t * 1.00 + seed) * 0.35
                 + Math.sin(t * 0.372 + seed * 2.13) * 0.28
                 + Math.sin(t * 0.631 + seed * 0.61) * 0.22
                 + Math.sin(t * 0.157 + seed * 3.77) * 0.15;
        }

        // Ngọn lửa bập bùng chân thực: không đồng bộ theo một chu kỳ cố định —
        // lúc hẹp lúc phình, lúc cao lúc thấp, lúc như sắp tắt rồi bùng lên cháy thẳng.
        // Mỗi ngọn lửa (số 2 và số 7) dùng một chu kỳ nhiễu riêng (seed lệch nhau)
        // nên 2 bên cháy KHÔNG đồng đều — bên này có thể đang bùng cao, sáng, nghiêng
        // một hướng trong khi bên kia đang lụi thấp, mờ, nghiêng hướng khác.
        function updateCandleFlames(time) {
            if (!flameSystem || !candleFlameData) return;
            const pos = flameSystem.geometry.attributes.position;
            const colAttr = flameSystem.geometry.attributes.color;
            const { indices, baseX, baseY, baseZ, phases, amp, hRatio, S, colorR, colorG, colorB, centerX, footY } = candleFlameData;
            const unit = S || 1;

            // Mỗi ngọn lửa (số 2 và số 7) có nhịp bập bùng RIÊNG — dùng seed lệch nhau
            // để 2 bên không còn cháy giống hệt nhau: bên này bùng cao/sáng thì bên kia
            // có thể đang lụi thấp/mờ, và độ nghiêng gió cũng khác nhau.
            function flameParamsForSeed(seedOff) {
                const windLeanX = flameNoise(time * 0.5, 11.3 + seedOff);
                const windLeanZ = flameNoise(time * 0.42 + 4, 6.6 + seedOff) * 0.5;
                const widthPulse = 1 + flameNoise(time * 0.85 + 2.2, 9.1 + seedOff) * 0.4;
                const heightNoise = flameNoise(time * 1.05, 1.0 + seedOff);
                const dimEvent = Math.max(0, -flameNoise(time * 0.48 + 8, 4.2 + seedOff) - 0.15);
                const flareEvent = Math.max(0, flameNoise(time * 0.6 + 15, 2.8 + seedOff) - 0.35);
                const heightScale = 1 + heightNoise * 0.3 - dimEvent * 1.3 + flareEvent * 0.9;
                const brightnessMod = 1 + heightNoise * 0.2 - dimEvent * 1.1 + flareEvent * 0.5;
                const widthFromEvent = 1 - dimEvent * 0.35 + flareEvent * 0.25;
                return { windLeanX, windLeanZ, widthPulse, heightScale, brightnessMod, widthFromEvent };
            }
            // seedOff = 0 cho số "2", lệch hẳn (100) cho số "7" → 2 chu kỳ nhiễu độc lập nhau
            const P2 = flameParamsForSeed(0);
            const P7 = flameParamsForSeed(100);

            for (let k = 0; k < indices.length; k++) {
                const i = indices[k];
                const idx = i * 3;
                const ph = phases[k];
                const hr = hRatio ? hRatio[k] : 1;
                const a = amp[k];
                const cx = centerX ? centerX[k] : 0;
                const P = cx < 0 ? P2 : P7;
                const { windLeanX, windLeanZ, widthPulse, heightScale, brightnessMod, widthFromEvent } = P;

                // Bán kính gốc quanh trục ngọn lửa (đã tách khỏi tâm) → co giãn theo widthPulse
                const radialX = (baseX[k] - cx) * widthPulse * widthFromEvent;
                const radialZ = baseZ[k] * widthPulse * widthFromEvent;

                // Nghiêng theo gió riêng của từng ngọn lửa: gốc gần như cố định, càng lên cao càng nghiêng nhiều
                const tiltX = windLeanX * hr * hr * 1.05 * unit;
                const tiltZ = windLeanZ * hr * hr * 0.7 * unit;

                // Rung nhỏ riêng từng hạt — không đồng bộ, để lửa trông "sống", không đều tăm tắp
                const jitterX = Math.sin(time * 6.3 + ph * 1.9) * a * 0.24 + Math.sin(time * 2.1 + ph * 3.1) * a * 0.15;
                const jitterZ = Math.cos(time * 5.1 + ph * 1.4) * a * 0.2 + Math.cos(time * 1.7 + ph * 2.6) * a * 0.13;

                // Chiều cao: co giãn quanh điểm chân lửa cố định (footY), cộng rung nhỏ riêng từng hạt
                const heightFromFoot = (baseY[k] - footY) * heightScale;
                const jitterY = Math.sin(time * 5.7 + ph * 2.3) * a * 0.3;

                pos.array[idx]     = cx + radialX + tiltX + jitterX;
                pos.array[idx + 1] = footY + heightFromFoot + jitterY;
                pos.array[idx + 2] = radialZ + tiltZ + jitterZ;

                // Nhấp nháy độ sáng theo nhịp bập bùng, thêm chút rung riêng từng hạt
                if (colAttr && colorR) {
                    const flick = brightnessMod + Math.sin(time * 8.6 + ph * 1.6) * 0.05;
                    colAttr.array[idx]     = Math.min(1, Math.max(0, colorR[k] * flick));
                    colAttr.array[idx + 1] = Math.min(1, Math.max(0, colorG[k] * flick));
                    colAttr.array[idx + 2] = Math.min(1, Math.max(0, colorB[k] * flick));
                }
            }
            pos.needsUpdate = true;
            if (colAttr) colAttr.needsUpdate = true;
        }

        function runMorph(targetX, targetY, targetZ, targetR, targetG, targetB, duration, ease, onComplete) {
            const fromPos = positions.slice(); const fromCol = colors.slice();
            const posAttr = particleSystem.geometry.attributes.position;
            const colAttr = particleSystem.geometry.attributes.color;
            const tweenState = { t: 0 };

            gsap.to(tweenState, {
                t: 1, duration: duration, ease: ease,
                onUpdate: () => {
                    const t = tweenState.t;
                    for (let i = 0; i < particleCount; i++) {
                        const idx = i * 3;
                        positions[idx]   = fromPos[idx]   + (targetX[i] - fromPos[idx])   * t;
                        positions[idx+1] = fromPos[idx+1] + (targetY[i] - fromPos[idx+1]) * t;
                        positions[idx+2] = fromPos[idx+2] + (targetZ[i] - fromPos[idx+2]) * t;
                        colors[idx]   = fromCol[idx]   + (targetR[i] - fromCol[idx])   * t;
                        colors[idx+1] = fromCol[idx+1] + (targetG[i] - fromCol[idx+1]) * t;
                        colors[idx+2] = fromCol[idx+2] + (targetB[i] - fromCol[idx+2]) * t;
                    }
                    posAttr.needsUpdate = true; colAttr.needsUpdate = true;
                },
                onComplete: () => {
                    for (let i = 0; i < particleCount; i++) {
                        const idx = i * 3;
                        positions[idx] = targetX[i]; positions[idx+1] = targetY[i]; positions[idx+2] = targetZ[i];
                        colors[idx] = targetR[i]; colors[idx+1] = targetG[i]; colors[idx+2] = targetB[i];
                    }
                    posAttr.needsUpdate = true; colAttr.needsUpdate = true;
                    if (onComplete) onComplete();
                }
            });
        }

        function updateCakeSparkle(time) {
            const colAttr = particleSystem.geometry.attributes.color;
            const { indices, phases, speeds, baseColors, colorIndices } = cakeSparkleData;
            const palette = CAKE_SPARKLE_PALETTE;

            for (let k = 0; k < indices.length; k++) {
                const i = indices[k];
                const idx = i * 3;
                const cyclePos = time * speeds[k] + phases[k];
                const raw = Math.sin(cyclePos);
                const flash = raw > 0 ? Math.pow(raw, 2.4) : 0;
                const boost = 1.0 + flash * 3.5;
                const [fr, fg, fb] = palette[colorIndices[k]];
                const [br, bg, bb] = baseColors[k];
                const mix = Math.min(1, flash * 1.4);
                colors[idx]   = Math.min(1.0, (br * (1 - mix) + fr * mix) * boost);
                colors[idx+1] = Math.min(1.0, (bg * (1 - mix) + fg * mix) * boost);
                colors[idx+2] = Math.min(1.0, (bb * (1 - mix) + fb * mix) * boost);
            }
            colAttr.needsUpdate = true;
        }

        function setTextShape() {
            currentShape = "text";
            const coords = hbdCoordsCache;
            const targetX = new Float32Array(particleCount);
            const targetY = new Float32Array(particleCount);
            const targetZ = new Float32Array(particleCount);
            const targetR = new Float32Array(particleCount).fill(1);
            const targetG = new Float32Array(particleCount).fill(1);
            const targetB = new Float32Array(particleCount).fill(1);

            for (let i = 0; i < particleCount; i++) {
                const coord = coords[i % coords.length];
                targetX[i] = coord.x + (Math.random() - 0.5) * 0.15;
                targetY[i] = coord.y + (Math.random() - 0.5) * 0.15;
                targetZ[i] = (Math.random() - 0.5) * 0.8;
            }
            runMorph(targetX, targetY, targetZ, targetR, targetG, targetB, 3.5, "power2.out");
        }

        function setHeartShape(onCycleComplete) {
            currentShape = "heart-forming"; isHeartRotating = false; heartCycleResolved = false;
            heartPulseScale = 1; pulseProxy.value = 1; heartOnCycleComplete = onCycleComplete;
            if (heartbeatTimeline) { heartbeatTimeline.kill(); heartbeatTimeline = null; }

            gsap.to(textGroup3D.scale, { x: 1, y: 1, z: 1, duration: 3.0, ease: "back.out(1.2)", delay: 0.8 });

            const S = getResponsiveScale();

            const targetX = new Float32Array(particleCount);
            const targetY = new Float32Array(particleCount);
            const targetZ = new Float32Array(particleCount);
            const targetR = new Float32Array(particleCount);
            const targetG = new Float32Array(particleCount);
            const targetB = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const phi = Math.random() * Math.PI * 2;
                const theta = Math.random() * Math.PI;
                const sinT = Math.sin(theta);
                // Hệ số bán kính ngẫu nhiên (phân bố đều theo diện tích) để hạt lấp đầy khối trong,
                // không chỉ nằm trên đúng viền bề mặt trái tim như trước
                const fillFactor = Math.sqrt(Math.random());
                const isSurface = Math.random() > 0.55; // một phần hạt vẫn bám viền để giữ đường nét rõ
                const radialFactor = isSurface ? 1.0 : fillFactor;

                const bx = 16 * Math.pow(sinT, 3) * Math.sin(phi) * radialFactor * 0.82 * S;
                const by = (13 * Math.cos(theta) - 5 * Math.cos(2*theta) - 2 * Math.cos(3*theta) - Math.cos(4*theta)) * 0.82 * S + 2 * S;
                const bz = (12 * Math.pow(sinT, 3) * Math.cos(phi)) * (0.35 + Math.random() * 0.45) * radialFactor * 0.82 * S;

                baseX[i] = bx; baseY[i] = by; baseZ[i] = bz;
                targetX[i] = bx; targetY[i] = by; targetZ[i] = bz;
                const isBright = Math.random() > 0.4;
                // Hạt càng gần lõi (radialFactor nhỏ) thì màu đỏ đậm hơn, hạt viền thì hồng sáng hơn -> nhìn rõ khối thay vì phẳng
                const coreMix = isSurface ? 1.0 : radialFactor;
                targetR[i] = isBright ? 1.0 : 0.85 * coreMix + 0.15;
                targetG[i] = isBright ? 0.12 * coreMix : 0.0;
                targetB[i] = isBright ? 0.55 * coreMix : 0.20 * coreMix;
            }

            runMorph(targetX, targetY, targetZ, targetR, targetG, targetB, 4.5, "power2.inOut", () => {
                currentShape = "heart"; heartPhaseStartTime = clock.getElapsedTime(); isHeartRotating = true;
                startHeartbeatLoop();
            });
        }

        function updateHeartPhase(time) {
            const elapsed = time - heartPhaseStartTime;
            const scale = heartPulseScale;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                positions[idx]   = baseX[i] * scale;
                positions[idx+1] = baseY[i] * scale;
                positions[idx+2] = baseZ[i] * scale;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            if (elapsed >= HEART_TOTAL_TIME && !heartCycleResolved) {
                heartCycleResolved = true; isHeartRotating = false;
                if (heartbeatTimeline) { heartbeatTimeline.kill(); heartbeatTimeline = null; }
                heartPulseScale = 1; pulseProxy.value = 1;
                if (typeof heartOnCycleComplete === "function") heartOnCycleComplete();
            }
        }

        function startHeartbeatLoop() {
            if (heartbeatTimeline) heartbeatTimeline.kill();
            heartbeatTimeline = gsap.timeline({ repeat: -1 })
                .to(pulseProxy, { value: 1.18, duration: 0.16, ease: "power2.out",   onUpdate: () => { heartPulseScale = pulseProxy.value; } })
                .to(pulseProxy, { value: 0.95, duration: 0.14, ease: "power1.inOut", onUpdate: () => { heartPulseScale = pulseProxy.value; } })
                .to(pulseProxy, { value: 1.09, duration: 0.12, ease: "power1.out",   onUpdate: () => { heartPulseScale = pulseProxy.value; } })
                .to(pulseProxy, { value: 1.0,  duration: 0.28, ease: "power2.inOut", onUpdate: () => { heartPulseScale = pulseProxy.value; } })
                .to(pulseProxy, { value: 1.0,  duration: 0.5 });
        }

        function setCakeShape() {
            currentShape = "cake-forming";
            gsap.to(textGroup3D.scale, { x: 0, y: 0, z: 0, duration: 1.5, ease: "power2.in" });

            const S = getResponsiveScale();
            const N = particleCount;

            // ── Bánh (hệ hạt chính — có quay) ──────────────────────────────
            const targetX = new Float32Array(N);
            const targetY = new Float32Array(N);
            const targetZ = new Float32Array(N);
            const targetR = new Float32Array(N);
            const targetG = new Float32Array(N);
            const targetB = new Float32Array(N);

            const sparkleIndices = [];
            const sparkleBaseColors = [];
            const sparkleColorIndices = [];

            // Đế 14% | thân 70% | kem 16%  (toàn bộ particleCount dùng cho bánh)
            const iBaseEnd = Math.floor(N * 0.14);
            const iBodyEnd = Math.floor(N * 0.84);

            for (let i = 0; i < N; i++) {
                let tx, ty, tz, r, g, b;
                if (i < iBaseEnd) {
                    const theta = Math.random() * Math.PI * 2;
                    const radius = 14 * Math.sqrt(Math.random()) * S;
                    tx = Math.sin(theta) * radius; ty = -8 * S; tz = Math.cos(theta) * radius;
                    r = 0.78; g = 0.55; b = 0.12;
                } else if (i < iBodyEnd) {
                    const theta = Math.random() * Math.PI * 2;
                    const radius = 10.5 * (0.88 + Math.random() * 0.12) * S;
                    tx = Math.sin(theta) * radius; ty = (-8 + Math.random() * 9) * S; tz = Math.cos(theta) * radius;
                    // 10 phần: 7 màu cầu vồng + 3 bạc
                    const bodyIdx = i - iBaseEnd;
                    const bodyTotal = iBodyEnd - iBaseEnd;
                    const bucket = Math.floor((bodyIdx / bodyTotal) * 10); // 0..9
                    if (bucket < 7) {
                        const ci = bucket;
                        const [cr, cg, cb] = CAKE_SPARKLE_PALETTE[ci];
                        r = cr * 0.5; g = cg * 0.5; b = cb * 0.5;
                        sparkleIndices.push(i);
                        sparkleBaseColors.push([r, g, b]);
                        sparkleColorIndices.push(ci);
                    } else {
                        r = 0.70; g = 0.72; b = 0.76;
                    }
                } else {
                    // Kem trắng mặt bánh
                    const theta = Math.random() * Math.PI * 2;
                    const radius = 9.8 * Math.sqrt(Math.random()) * S;
                    tx = Math.sin(theta) * radius; ty = (0.9 + Math.random() * 1.1) * S; tz = Math.cos(theta) * radius;
                    r = 0.94; g = 0.94; b = 0.96;
                }
                targetX[i] = tx; targetY[i] = ty; targetZ[i] = tz;
                targetR[i] = r; targetG[i] = g; targetB[i] = b;
            }

            // ── Nến 27 (khối 3D bóng — cùng style số 30/08, KHÔNG quay) ─────
            const CN = Math.min(45000, Math.floor(N * 0.30));
            const flameIndices = [], flameBaseX = [], flameBaseY = [], flameBaseZ = [], flamePhases = [], flameAmp = [], flameHRatio = [];
            const flameColorR = [], flameColorG = [], flameColorB = [], flameCenterX = [];

            // Chân số gần sát mặt bánh (cắm vào bánh)
            const cakeTopY = 2.0 * S;
            // Số to hơn một tí, hai số đứng gần nhau hơn
            const digitScale = 0.45 * S;
            const digitYScale = digitScale * 1.28;
            // Hai số gần nhau hơn (kèm lửa)
            const offset2X = -1.70 * S;
            const offset7X =  1.70 * S;
            // Hạ chân số chìm xuống dưới bề mặt kem; nâng nhẹ để không lộ đáy
            const digitYBase = cakeTopY - 0.25 * S;

            const nFlame2 = Math.floor(CN * 0.12);
            const nFlameTotal = nFlame2 * 2;
            const flamePos = new Float32Array(nFlameTotal * 3);
            const flameCol = new Float32Array(nFlameTotal * 3);
            let fIdx = 0;

            for (let i = 0; i < nFlameTotal; i++) {
                let tx, ty, tz, r, g, b;
                const onDigit2 = i < nFlame2;
                const cx = onDigit2 ? offset2X : offset7X;
                // Lửa trên số 2 / số 7 — nằm chính giữa đầu mỗi chữ số
                const h = Math.random() * 2.3;
                const w = Math.sin((h / 2.3) * Math.PI) * (1.0 - h / 2.3 * 0.4) * 0.30 * S;
                const ang = Math.random() * Math.PI * 2;
                tx = cx + Math.cos(ang) * w;
                ty = digitYBase + 7.6 * digitYScale + h * 0.75 * S;
                tz = Math.sin(ang) * w;
                if (h < 0.45) { r = 0.3; g = 0.6; b = 1.0; }
                else if (h < 1.5) { r = 1.0; g = 0.88; b = 0.25; }
                else { r = 1.0; g = 0.4; b = 0.08; }
                flameIndices.push(fIdx);
                flameBaseX.push(tx); flameBaseY.push(ty); flameBaseZ.push(tz);
                flamePhases.push(Math.random() * Math.PI * 2);
                flameAmp.push(0.08 * S + Math.random() * 0.12 * S);
                flameHRatio.push(h / 2.3);
                flameColorR.push(r); flameColorG.push(g); flameColorB.push(b);
                flameCenterX.push(cx);
                const fi = fIdx++ * 3;
                flamePos[fi] = tx; flamePos[fi+1] = ty; flamePos[fi+2] = tz;
                flameCol[fi] = r; flameCol[fi+1] = g; flameCol[fi+2] = b;
            }

            // Tạo / cập nhật candleSystem (số 27 dạng khối 3D bóng — cùng style số 30/08, giữ màu hồng)
            if (candleSystem) {
                scene.remove(candleSystem);
                candleSystem.traverse(obj => {
                    if (obj.isMesh) {
                        obj.geometry.dispose();
                        if (obj.material.map) obj.material.map.dispose();
                        obj.material.dispose();
                    }
                });
                candleSystem = null;
            }
            const digitCenterY = digitYBase + 4.0 * digitYScale;
            // To hơn một tí, gần nhau; màu giống SVG (#ffb6c1 mặt trước, #d47385 lớp sâu)
            const digitWidth  = 3.15 * S;
            const digitHeight = 4.15 * S;
            const FRONT_PINK = 0xffb6c1;
            const DEPTH_PINK = 0xd47385;
            candleSystem = new THREE.Group();
            const digit2 = createGlowDigitMesh("2", offset2X, digitCenterY, 0, digitWidth, digitHeight, FRONT_PINK, DEPTH_PINK);
            const digit7 = createGlowDigitMesh("7", offset7X, digitCenterY, 0, digitWidth, digitHeight, FRONT_PINK, DEPTH_PINK);
            candleSystem.add(digit2);
            candleSystem.add(digit7);
            candleSystem.visible = false;
            scene.add(candleSystem);

            // Tạo / cập nhật flameSystem (hệ hạt lửa riêng — vẫn cộng sáng để lung linh)
            if (flameSystem) {
                scene.remove(flameSystem);
                flameSystem.geometry.dispose();
                flameSystem.material.dispose();
                flameSystem = null;
            }
            const fGeo = new THREE.BufferGeometry();
            fGeo.setAttribute('position', new THREE.BufferAttribute(flamePos, 3));
            fGeo.setAttribute('color', new THREE.BufferAttribute(flameCol, 3));
            const fMat = new THREE.PointsMaterial({
                size: 0.10, map: particleSystem.material.map, vertexColors: true,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            });
            flameSystem = new THREE.Points(fGeo, fMat);
            flameSystem.visible = false;
            scene.add(flameSystem);

            runMorph(targetX, targetY, targetZ, targetR, targetG, targetB, 5.5, "power3.inOut", () => {
                currentShape = "cake";
                if (particleSystem && particleSystem.material) {
                    particleSystem.material.size = 0.045;
                }
                if (candleSystem) {
                    candleSystem.visible = true;
                    candleSystem.rotation.y = 0;
                }
                if (flameSystem) {
                    flameSystem.visible = true;
                    flameSystem.rotation.y = 0;
                }
                candleFlameData = {
                    indices: flameIndices,
                    baseX: flameBaseX, baseY: flameBaseY, baseZ: flameBaseZ,
                    phases: flamePhases, amp: flameAmp, hRatio: flameHRatio, S: S,
                    colorR: flameColorR, colorG: flameColorG, colorB: flameColorB,
                    centerX: flameCenterX, footY: digitYBase + 7.6 * digitYScale
                };
                cakeSparkleData = {
                    indices: sparkleIndices,
                    baseColors: sparkleBaseColors,
                    colorIndices: sparkleColorIndices,
                    phases: sparkleIndices.map(() => Math.random() * Math.PI * 2),
                    speeds: sparkleIndices.map(() => 1.4 + Math.random() * 2.4)
                };
                gsap.to("#btn-thoi", { opacity: 1, y: 0, duration: 1.5, delay: 0.3 });
            });
        }

        function runTimeline() {
            let tl = gsap.timeline();
            tl.call(() => setTextShape(), null, 0);
            tl.to({}, { duration: 5.5 });
            tl.call(() => { setHeartShape(() => { setCakeShape(); }); });
        }

        function createPremiumSparks(x, y) {
            const container = document.getElementById('laser-screen');
            const sparkColors = ['#ff2200', '#ff6600', '#ffcc00', '#ffffff'];
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'sparkle-particle';
                particle.style.left = `${x}px`;
                particle.style.top  = `${y}px`;
                particle.style.background = sparkColors[Math.floor(Math.random() * sparkColors.length)];
                particle.style.boxShadow = `0 0 6px ${particle.style.background}`;
                container.appendChild(particle);
                const angle = (Math.random() * Math.PI * 1.4) - (Math.PI * 0.2);
                const speed = Math.random() * 90 + 50;
                gsap.to(particle, {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed + (Math.random() * 40 + 20),
                    opacity: 0, scale: Math.random() * 0.8 + 0.2,
                    duration: Math.random() * 0.5 + 0.3, ease: "power1.out",
                    onComplete: () => particle.remove()
                });
            }
        }

        function triggerLaserCut() {
            const laserScreen = document.getElementById('laser-screen');
            const laserSpark  = document.getElementById('laser-spark');
            const laserLine   = document.getElementById('laser-line');
            const chars = document.querySelectorAll('.char');

            laserScreen.style.display = 'flex';
            laserSpark.style.display  = 'block';
            laserLine.style.display   = 'block';

            const laserTimeline = gsap.timeline({
                onComplete: () => {
                    gsap.to([laserSpark, laserLine], { opacity: 0, duration: 0.4, onComplete: () => {
                        laserSpark.style.display = 'none';
                        laserLine.style.display  = 'none';
                    }});
                }
            });

            const stepDuration = 0.07;
            chars.forEach((charElement, index) => {
                const rect = charElement.getBoundingClientRect();
                const targetX = rect.left + rect.width / 2;
                const targetY = rect.top  + rect.height / 2;

                if (index === 0) {
                    laserTimeline.set(laserSpark, { top: targetY, left: targetX });
                    laserTimeline.set(laserLine,  { left: targetX, height: targetY });
                } else {
                    laserTimeline.to(laserSpark, { left: targetX, top: targetY, duration: stepDuration, ease: "none" }, index * stepDuration);
                    laserTimeline.to(laserLine,  { left: targetX, height: targetY, duration: stepDuration, ease: "none" }, index * stepDuration);
                }

                laserTimeline.call(() => {
                    createPremiumSparks(targetX, targetY);
                    charElement.style.color = '#ff1100';
                    charElement.style.textShadow = '0 0 12px #ff1100, 0 0 25px #ff6600, 0 0 45px #ffaa00, 0 0 70px #ff0000';
                    gsap.to(charElement, {
                        y: Math.random() * 6 + 4, x: (Math.random() - 0.5) * 2,
                        rotationZ: (Math.random() - 0.5) * 4, duration: 0.3, ease: "power1.out"
                    });
                    gsap.to(charElement, {
                        color: '#111111', textShadow: '2px 2px 4px rgba(0,0,0,0.5)',
                        duration: 0.5, delay: 0.15
                    });
                }, null, index * stepDuration);
            });
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                camera.position.z = getResponsiveCameraZ();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
